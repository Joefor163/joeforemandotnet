<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topic Title — Joe Foreman</title>
  <meta name="description" content="Description of this topic site." />

  <!-- ─────────────────────────────────────────────────────
       THEME SYSTEM — three pieces that need to be on EVERY
       page for the day/night toggle to work correctly:
         1. Inline pre-paint <script> (this avoids the
            flash-of-wrong-theme on initial load)
         2. <link rel="stylesheet" href="/assets/theme.css">
            (toggle button styling + color-scheme rules)
         3. <button id="theme-toggle" ...>  (in <nav>)
         4. <script src="/assets/theme.js" defer>  (just before
            </body> — wires up the click handler)
       Plus: a light :root palette and a dark
       :root[data-theme="dark"] override in this page's <style>.
  ───────────────────────────────────────────────────── -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="stylesheet" href="/assets/theme.css" />

  <!-- Cloudflare Web Analytics (same token as homepage) -->
  <!-- <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
    data-cf-beacon='{"token": "PASTE_YOUR_TOKEN_HERE"}'></script> -->

  <style>
    /* Light (day) — default */
    :root {
      --color-bg:        #ffffff;
      --color-surface:   #f6f7fb;
      --color-border:    #e3e6ee;
      --color-accent:    #2f5fe0;
      --color-accent-2:  #6a3fb8;
      --color-text:      #14161d;
      --color-muted:     #5b6072;
      --color-bg-translucent: rgba(255, 255, 255, 0.88);
      --radius:          12px;
      --max-width:       780px;
      --font-sans:       'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    /* Dark (night) override */
    :root[data-theme="dark"] {
      --color-bg:        #0f1117;
      --color-surface:   #1a1d27;
      --color-border:    #2a2d3a;
      --color-accent:    #4f7ef8;
      --color-accent-2:  #7c5cbf;
      --color-text:      #e8eaf0;
      --color-muted:     #8b8fa8;
      --color-bg-translucent: rgba(15, 17, 23, 0.88);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      line-height: 1.7;
      min-height: 100vh;
    }

    a { color: var(--color-accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* NAV */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--color-bg-translucent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border);
    }

    .nav-right { display: flex; align-items: center; gap: 14px; }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .nav-back {
      font-size: 0.9rem;
      color: var(--color-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .nav-back:hover { color: var(--color-text); text-decoration: none; }

    .nav-logo {
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-text);
    }

    /* PAGE CONTENT */
    .page {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 64px 24px 96px;
    }

    .page-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-accent);
      background: rgba(79,126,248,0.1);
      border-radius: 6px;
      padding: 4px 12px;
      margin-bottom: 20px;
    }

    .page-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .page-subtitle {
      font-size: 1.1rem;
      color: var(--color-muted);
      margin-bottom: 48px;
      padding-bottom: 48px;
      border-bottom: 1px solid var(--color-border);
    }

    /* ARTICLE / POST CARDS */
    .posts-list {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .post-card {
      display: block;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 28px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .post-card:hover {
      border-color: var(--color-accent);
      transform: translateY(-2px);
      text-decoration: none;
    }

    .post-date {
      font-size: 0.78rem;
      color: var(--color-muted);
      margin-bottom: 10px;
    }

    .post-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 8px;
    }

    .post-excerpt {
      font-size: 0.9rem;
      color: var(--color-muted);
    }

    /* VIDEO EMBEDS */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: var(--radius);
      margin: 40px 0;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    /* PROSE content */
    .prose h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 48px 0 16px;
    }

    .prose p {
      margin-bottom: 20px;
      color: var(--color-text);
    }

    .prose p:first-child { color: var(--color-text); }

    /* FOOTER */
    footer {
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding: 32px 0;
      text-align: center;
      font-size: 0.82rem;
      color: var(--color-muted);
    }

    footer a { color: var(--color-muted); }
    footer a:hover { color: var(--color-text); text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <nav>
      <a class="nav-back" href="/">← Joe Foreman</a>
      <div class="nav-right">
        <span class="nav-logo">Topic Title</span>
        <button id="theme-toggle" class="theme-toggle" type="button"
                aria-label="Toggle day / night mode" title="Toggle day / night mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <main class="page">

    <span class="page-tag">Category</span>
    <h1 class="page-title">Topic Title</h1>
    <p class="page-subtitle">A short description of what this section of the site covers and who it's for.</p>

    <!-- ══════════════════════════════════════════════════════════

  </main>

  <footer>
    &copy; <script>document.write(new Date().getFullYear())</script> Joe Foreman. All rights reserved.
  </footer>

  <script src="/assets/theme.js" defer></script>

</body>
